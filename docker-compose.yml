###############################################################
#  OpenClaw Elite Mini M9 — Full AI Stack
#  Docker Compose for Windows (Docker Desktop + WSL2 backend)
#  Hardware: Intel N150 | 16GB RAM | 2GB GPU
#  Author: AnorakAdrianyc | Updated: 2026-03-29
###############################################################
#
#  SERVICES INCLUDED:
#    1. openclaw       — AI agent gateway (Node.js, port 3000)
#    2. ollama         — Local LLM inference engine (port 11434)
#    3. open-webui     — ChatGPT-style UI for Ollama (port 8080)
#    4. localai        — OpenAI-compatible API, CPU-only (port 8081)
#    5. anythingllm    — Private AI workspace + RAG (port 3001)
#    6. turboquant     — C-based quant finance engine (port 5050)
#
#  QUICK START (Windows PowerShell / CMD):
#    docker compose up -d
#    docker compose logs -f openclaw
#
#  REQUIREMENTS:
#    - Docker Desktop >= 4.x with WSL2 backend
#    - Increase Docker memory to 12GB:
#        Docker Desktop → Settings → Resources → Memory → 12GB
#    - Copy .env.example to .env and fill in your API keys
###############################################################

version: "3.9"

###############################################################
# NETWORKS
###############################################################
networks:
  openclaw-net:
    driver: bridge

###############################################################
# VOLUMES
###############################################################
volumes:
  ollama-data:
  open-webui-data:
  localai-data:
  anythingllm-data:
  turboquant-results:
  openclaw-memory:

###############################################################
# SERVICES
###############################################################
services:

  # ============================================================
  # 1. OPENCLAW — AI Agent Gateway
  #    Chat via Telegram/WhatsApp/Discord/Slack/Web
  #    https://github.com/openclaw/openclaw
  # ============================================================
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    ports:
      - "3000:3000"       # Web dashboard
    environment:
      - NODE_ENV=production
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENCLAW_API_KEY=${OPENCLAW_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434   # use local Ollama as backend
      - LOCALAI_BASE_URL=http://localai:8080
      - DATABASE_URL=sqlite:////openclaw/data/openclaw.db
    volumes:
      - ./openclaw.json:/root/.openclaw/openclaw.json:ro   # your hardened config
      - ./.env:/root/.openclaw/.env:ro
      - openclaw-memory:/openclaw/memory
      - ./skills:/root/.openclaw/skills                    # antigravity skills
    networks:
      - openclaw-net
    depends_on:
      - ollama
      - localai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ============================================================
  # 2. OLLAMA — Local LLM Inference Engine
  #    https://github.com/ollama/ollama
  #    Supports: Llama 4, Phi-4, Mistral, Gemma 3, DeepSeek, Qwen
  #    N150 note: Use Q4_K_M quantized models (≤7B fit in 8GB RAM)
  # ============================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - openclaw-net
    # GPU passthrough — remove if no NVIDIA GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    deploy:
      resources:
        limits:
          memory: 8G          # adjust based on model size
          cpus: "3.0"         # leave 1 core for OS
    environment:
      - OLLAMA_NUM_PARALLEL=1   # N150 constraint: 1 request at a time
      - OLLAMA_MAX_LOADED_MODELS=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================
  # 3. OPEN WEBUI — ChatGPT-style Frontend for Ollama
  #    https://github.com/open-webui/open-webui
  #    Features: RAG, hybrid search, MCP server support, multi-user
  # ============================================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_BASE_URL=http://localai:8080/v1
      - OPENAI_API_KEY=${ANTHROPIC_API_KEY:-dummy}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-changeme-secret-key}
      - WEBUI_AUTH=true                # enable login
      - ENABLE_RAG_WEB_SEARCH=true
      - ENABLE_IMAGE_GENERATION=false  # save VRAM on N150
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - openclaw-net
    depends_on:
      - ollama
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"

  # ============================================================
  # 4. LOCALAI — OpenAI-Compatible API, CPU-Only, All Modalities
  #    https://github.com/mudler/LocalAI
  #    Supports: LLMs, Stable Diffusion, Whisper TTS/STT
  #    N150 optimized: CPU-only AIO image
  # ============================================================
  localai:
    image: localai/localai:latest-aio-cpu
    container_name: localai
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - DEBUG=false
      - MODELS_PATH=/models
      - CONTEXT_SIZE=2048             # lower = less RAM on N150
      - THREADS=2                     # 2 threads for N150
      - PARALLEL_REQUESTS=false
    volumes:
      - localai-data:/models
    networks:
      - openclaw-net
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 60s
      timeout: 30s
      retries: 5

  # ============================================================
  # 5. ANYTHINGLLM — Private AI Workspace + RAG + Agents
  #    https://github.com/Mintplex-Labs/anything-llm
  #    53k+ stars | Supports 30+ LLM providers | 9+ vector DBs
  #    Connect your Notion, GitHub, YouTube, Confluence docs
  # ============================================================
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    restart: unless-stopped
    ports:
      - "3001:3001"
    cap_add:
      - SYS_ADMIN
    environment:
      - STORAGE_DIR=/app/server/storage
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_PATH=http://ollama:11434
      - OLLAMA_MODEL_PREF=llama3.2:3b      # 3B fits well on N150
      - OLLAMA_MODEL_TOKEN_LIMIT=4096
      - EMBEDDING_ENGINE=ollama
      - EMBEDDING_BASE_PATH=http://ollama:11434
      - EMBEDDING_MODEL_PREF=nomic-embed-text
      - VECTOR_DB=lancedb                   # lightweight, no extra container
      - JWT_SECRET=${JWT_SECRET:-change-this-jwt-secret}
    volumes:
      - anythingllm-data:/app/server/storage
    networks:
      - openclaw-net
    depends_on:
      - ollama
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"

  # ============================================================
  # 6. TURBOQUANT — C-Based Quantitative Finance Engine
  #    Custom build from Qwen session config
  #    Compiled with: gcc -O3 -march=native -mtune=intel -fopenmp
  #    Exposes REST API on port 5050 for OpenClaw integration
  # ============================================================
  turboquant:
    build:
      context: ./turboquant
      dockerfile: Dockerfile
    container_name: turboquant
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - FINANCE_API_KEY=${FINANCE_API_KEY:-}
      - MAX_MEMORY_GB=2
      - CPU_CORES=2
      - COMPILER_FLAGS=-O3 -march=native -mtune=intel
    volumes:
      - turboquant-results:/app/results
      - ./turboquant/data:/app/data:ro
    networks:
      - openclaw-net
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
